update_weight:
  fields:
    weight:
      required: true
      example: 80.5
      selector:
        number:
          min: 20
          max: 250
          step: 0.1
          unit_of_measurement: kg
          mode: box

update_height:
  fields:
    height:
      required: true
      example: 178
      selector:
        number:
          min: 100
          max: 250
          step: 0.5
          unit_of_measurement: cm
          mode: box

update_units:
  fields:
    units:
      required: true
      selector:
        select:
          options:
            - "METRIC"
            - "IMPERIAL"

update_settings:
  fields:
    settings:
      required: true
      example: '{"weight": 80, "height": 178, "units": "METRIC"}'
      selector:
        object:

update_profile:
  fields:
    userName:
      example: "MyRider"
      selector:
        text:
    firstName:
      selector:
        text:
    lastName:
      selector:
        text:
    countryIsoCode:
      example: "US"
      selector:
        text:
    gender:
      selector:
        select:
          options:
            - "MALE"
            - "FEMALE"
    dateOfBirth:
      selector:
        date:
    accountPrivacy:
      selector:
        select:
          options:
            - "PUBLIC"
            - "PRIVATE"

update_timezone:
  fields:
    timezone:
      required: true
      example: "Europe/Prague"
      selector:
        text:

update_ftp:
  fields:
    ftp_source:
      required: true
      selector:
        select:
          options:
            - "MANUAL"
            - "ESTIMATED"
    value:
      example: 250
      selector:
        number:
          min: 50
          max: 700
          unit_of_measurement: W
          mode: box

update_zones:
  fields:
    zone_type:
      required: true
      selector:
        select:
          options:
            - "power"
            - "heartRate"
    zones:
      required: true
      example: "[55, 75, 90, 105, 120, 150]"
      selector:
        object:

update_max_heart_rate:
  fields:
    max_heart_rate:
      required: true
      example: 185
      selector:
        number:
          min: 60
          max: 250
          unit_of_measurement: bpm
          mode: box

register_challenge:
  fields:
    slug:
      required: true
      example: "october-climb-2026"
      selector:
        text:

register_event:
  fields:
    event_id:
      required: true
      example: "3f1c2b9a-5d7e-4a1b-9c3d-2e4f6a8b0c1d"
      selector:
        text:

unregister_event:
  fields:
    event_id:
      required: true
      example: "3f1c2b9a-5d7e-4a1b-9c3d-2e4f6a8b0c1d"
      selector:
        text:

