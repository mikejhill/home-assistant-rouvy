name: Release

# Manually cut a release from main:
#   Actions -> Release -> Run workflow -> version (e.g. 2.1.0)
# The workflow bumps every version string, promotes the CHANGELOG's [Unreleased]
# notes, re-vendors the library, runs every quality gate, then commits, tags,
# and publishes a GitHub release that HACS picks up.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 2.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a new tag
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7

      # ── Prepare ─────────────────────────────────────────────
      - name: Bump versions and promote CHANGELOG notes
        run: uv run scripts/release.py prepare "$VERSION"

      - name: Refresh lockfile and vendored library
        run: |
          uv lock
          uv sync --locked
          uv run poe vendor

      # ── Validate (after the bump, so version-consistency tests see it) ──
      - name: Quality gates
        run: uv run poe check

      # ── Build ───────────────────────────────────────────────
      - run: uv build
      - name: Package the integration for manual installs
        run: cd custom_components/rouvy && zip -r ../../dist/rouvy.zip . -x "*/__pycache__/*"
      - name: Release notes
        run: uv run scripts/release.py notes "$VERSION" > release-notes.md

      # ── Publish ─────────────────────────────────────────────
      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- pyproject.toml uv.lock CHANGELOG.md src custom_components
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/rouvy.zip
