version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # pytest-homeassistant-custom-component pins exact pytest and pytest-asyncio
      # versions; bumping either on its own makes the lockfile unresolvable and fails
      # every "uv in /." update run. They move when the HA test harness is bumped.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
